<!doctype html>
<!--
  code2video animation template — the HTML contract.

  A code2video animation is ONE self-contained HTML file that implements:

    window.VIDEO_SPEC = { fps, frames, width, height }   // optional metadata
    window.__renderFrame(index, t)                       // REQUIRED

  __renderFrame(index, t) must draw the *entire* frame `index` from scratch,
  deterministically. t = index / fps is the time in seconds.

  RULES (determinism is what makes screenshots reproducible):
    * never use Date.now(), performance.now(), Math.random() without a seed,
      or anything derived from real time
    * never depend on requestAnimationFrame having run
    * never load external resources (fonts, images, CDNs) — keep it self-contained
    * keep total frames modest (<= 600); preview with --frames 12 first

  Try it:
    python -m code2video render --html this_file.html --out preview.mp4 --frames 12
    python -m code2video render --html this_file.html --out final.mp4
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>code2video template</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #0b1020;
    width: 1280px; height: 720px;
  }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="stage" width="1280" height="720"></canvas>
<script>
"use strict";

// ---- metadata (CLI flags override these) --------------------------------
const SPEC = { fps: 30, frames: 150, width: 1280, height: 720 };
window.VIDEO_SPEC = SPEC;

// ---- tiny helpers --------------------------------------------------------
const canvas = document.getElementById("stage");
const ctx = canvas.getContext("2d");

// deterministic pseudo-random generator (mulberry32) — same seed, same video
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ease-out cubic
const easeOut = (p) => 1 - Math.pow(1 - p, 3);

// ---- the one required function -------------------------------------------
window.__renderFrame = function (index, t) {
  const W = SPEC.width, H = SPEC.height;
  const progress = index / (SPEC.frames - 1);        // 0..1 over the whole clip

  // background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, "#0b1020");
  bg.addColorStop(1, "#1b2545");
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // a bar that grows with easing, then a title that fades in
  const barW = easeOut(Math.min(1, progress / 0.6)) * (W - 160);
  ctx.fillStyle = "#4cc9f0";
  ctx.fillRect(80, H / 2 - 30, barW, 60);

  const alpha = Math.max(0, Math.min(1, (progress - 0.5) / 0.3));
  ctx.globalAlpha = alpha;
  ctx.fillStyle = "#f8f9fa";
  ctx.font = "600 64px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillText("code2video", W / 2, H / 2 - 60);
  ctx.globalAlpha = 1;
};
</script>
</body>
</html>
