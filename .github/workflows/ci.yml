name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      # GitHub's ubuntu images ship Chrome but not ffmpeg; windows images
      # ship Chrome and use the imageio-ffmpeg wheel from requirements.txt.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Unit tests
        run: pytest -q

      # End-to-end: launch headless Chrome, render 3 frames, compose an MP4.
      - name: Smoke test (headless Chrome -> MP4)
        env:
          CODE2VIDEO_SMOKE: "1"
        run: pytest tests/test_smoke.py -q -s
