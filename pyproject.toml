[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "code2video"
version = "0.1.0"
description = "Let a text model draw videos frame by frame with code: HTML animation -> headless Chrome screenshots -> ffmpeg MP4, GPU auto-detected."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "code2video contributors" }]
keywords = ["video", "animation", "headless-chrome", "ffmpeg", "cdp", "text-to-video", "canvas"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video :: Conversion",
]
dependencies = ["websocket-client>=1.3"]

[project.optional-dependencies]
ffmpeg = ["imageio-ffmpeg>=0.4"]
dev = ["pytest>=7"]

[project.scripts]
code2video = "code2video.cli:main"

[project.urls]
Homepage = "https://github.com/feng2013111/code2video"

[tool.setuptools]
packages = ["code2video"]

[tool.pytest.ini_options]
testpaths = ["tests"]
